<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Performance Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header class="dashboard__header">
            <div class="header__content">
                <h1 class="header__title">Stock Performance Dashboard</h1>
                <div class="header__info">
                    <div class="current-time" id="currentTime"></div>
                    <div class="last-updated">Last updated: <span id="lastUpdated"></span></div>
                </div>
            </div>
        </header>

        <!-- Filters -->
        <div class="filters">
            <div class="time-filters">
                <button class="btn btn--sm filter-btn active" data-period="1D">1D</button>
                <button class="btn btn--sm filter-btn" data-period="1W">1W</button>
                <button class="btn btn--sm filter-btn" data-period="1M">1M</button>
                <button class="btn btn--sm filter-btn" data-period="3M">3M</button>
                <button class="btn btn--sm filter-btn" data-period="YTD">YTD</button>
                <button class="btn btn--sm filter-btn" data-period="1Y">1Y</button>
            </div>
            <div class="sector-filter">
                <select class="form-control" id="sectorFilter">
                    <option value="all">All Sectors</option>
                    <option value="Technology">Technology</option>
                    <option value="Communication Services">Communication Services</option>
                    <option value="Industrials">Industrials</option>
                    <option value="Energy">Energy</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Financials">Financials</option>
                    <option value="Consumer Discretionary">Consumer Discretionary</option>
                    <option value="Health Care">Health Care</option>
                    <option value="Consumer Staples">Consumer Staples</option>
                    <option value="Materials">Materials</option>
                    <option value="Real Estate">Real Estate</option>
                </select>
            </div>
        </div>

        <!-- Main Content -->
        <main class="dashboard__main">
            <!-- Market Overview -->
            <section class="market-overview">
                <h2 class="section-title">Market Overview</h2>
                <div class="market-cards" id="marketCards">
                    <!-- Market index cards will be populated by JavaScript -->
                </div>
            </section>

            <!-- Market Performance Chart -->
            <section class="chart-section">
                <h2 class="section-title">Daily Performance Overview</h2>
                <div class="chart-container">
                    <img src="https://pplx-res.cloudinary.com/image/upload/v1750298155/pplx_code_interpreter/f7394657_wlqldp.jpg" alt="Daily Performance Across Major Asset Classes" class="performance-chart">
                </div>
            </section>

            <!-- Top Gainers and Losers -->
            <section class="gainers-losers">
                <div class="gainers-losers__container">
                    <div class="gainers">
                        <h3 class="subsection-title">Top Gainers</h3>
                        <div class="stock-table" id="topGainers">
                            <!-- Top gainers will be populated by JavaScript -->
                        </div>
                    </div>
                    <div class="losers">
                        <h3 class="subsection-title">Top Losers</h3>
                        <div class="stock-table" id="topLosers">
                            <!-- Top losers will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Currencies and Commodities -->
            <section class="assets-overview">
                <div class="currencies">
                    <h3 class="subsection-title">Currency Performance</h3>
                    <div class="asset-cards" id="currencyCards">
                        <!-- Currency cards will be populated by JavaScript -->
                    </div>
                </div>
                <div class="commodities">
                    <h3 class="subsection-title">Commodities Tracking</h3>
                    <div class="asset-cards" id="commodityCards">
                        <!-- Commodity cards will be populated by JavaScript -->
                    </div>
                </div>
            </section>

            <!-- Sector Performance -->
            <section class="sector-performance">
                <h2 class="section-title">Sector Performance</h2>
                <div class="chart-container">
                    <img src="https://pplx-res.cloudinary.com/image/upload/v1750298083/pplx_code_interpreter/c787b18e_tmob1l.jpg" alt="Market Sector Performance: Year-to-Date Returns" class="sector-chart">
                </div>
                <div class="sector-table" id="sectorTable">
                    <!-- Sector table will be populated by JavaScript -->
                </div>
            </section>

            <!-- Market News -->
            <section class="market-news">
                <h2 class="section-title">Latest Market News</h2>
                <div class="news-feed" id="newsFeed">
                    <!-- News items will be populated by JavaScript -->
                </div>
            </section>

            <!-- Investment Insights -->
            <section class="investment-insights">
                <h2 class="section-title">Investment Insights</h2>
                <div class="insights-container">
                    <div class="market-outlook">
                        <h3 class="subsection-title">Market Outlook</h3>
                        <div class="outlook-content" id="marketOutlook">
                            <!-- Market outlook will be populated by JavaScript -->
                        </div>
                    </div>
                    <div class="recommendations">
                        <h3 class="subsection-title">Actionable Recommendations</h3>
                        <div class="recommendations-content" id="recommendations">
                            <!-- Recommendations will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
